services:
  wordpaper:
    build: .
    container_name: wordpaper
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORDPAPER_PORT:-8770}:8770"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8770
      WORDPAPER_MODE: public
      WORDPAPER_DATA_DIR: /data
      WORDPAPER_COMPANION_ENABLED: 0
      WORDPAPER_PUBLIC_ORIGIN: "${WORDPAPER_PUBLIC_ORIGIN:-}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      WORDPAPER_GOOGLE_CLIENT_ID: "${WORDPAPER_GOOGLE_CLIENT_ID:-}"
      WORDPAPER_GOOGLE_CLIENT_SECRET: "${WORDPAPER_GOOGLE_CLIENT_SECRET:-}"
      WORDPAPER_GOOGLE_REDIRECT_URI: "${WORDPAPER_GOOGLE_REDIRECT_URI:-}"
      WORDPAPER_WECHAT_APP_ID: "${WORDPAPER_WECHAT_APP_ID:-}"
      WORDPAPER_WECHAT_APP_SECRET: "${WORDPAPER_WECHAT_APP_SECRET:-}"
      WORDPAPER_WECHAT_REDIRECT_URI: "${WORDPAPER_WECHAT_REDIRECT_URI:-}"
      WORDPAPER_RESEND_API_KEY: "${WORDPAPER_RESEND_API_KEY:-}"
      WORDPAPER_EMAIL_FROM: "${WORDPAPER_EMAIL_FROM:-}"
    volumes:
      - wordpaper-data:/data

volumes:
  wordpaper-data:
    name: wordpaper-data
